name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: fmt
        run: deno fmt --check scripts/ opencode/scripts/

      - name: lint
        run: deno task lint

      - name: check
        run: deno task check

      - name: test
        run: deno task test
