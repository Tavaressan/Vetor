name: CI

on:
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instala dependências
        run: npm install
        working-directory: cli

      - name: Roda a suíte de testes do pacote
        run: npm test
        working-directory: cli

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: fmt
        run: deno fmt --check scripts/ opencode/scripts/

      - name: lint
        run: deno task lint

      - name: check
        run: deno task check

      - name: test
        run: deno task test
