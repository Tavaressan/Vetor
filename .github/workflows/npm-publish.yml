name: NPM Publish (cli)

# Dispara quando uma GitHub Release é publicada. IMPORTANTE: `release:
# published` dispara em TODA Release do repositório, inclusive as tags
# `vX.Y.Z` que versionam o plugin (`plugin.json`) — v0.2.0, v0.2.1, v0.2.3,
# v1.0.0 etc. Para não publicar o npm por engano numa release do plugin, o job
# abaixo tem um guard (`if:`) que só publica quando a tag da release segue a
# convenção `cli-vX.Y.Z`, reservada para releases do subpacote `cli/` (npm
# "vetor"). Releases do plugin devem continuar usando `vX.Y.Z`.
# `workflow_dispatch` permite rodar o job manualmente sem publicar uma
# release; por padrão roda em modo dry-run (ver input `dry_run` abaixo).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: valida a checagem de versão sem publicar de fato'
        type: boolean
        default: true

# Dry-run local, sem publicar de fato (não requer NPM_TOKEN nem login):
#   cd cli && npm publish --dry-run

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Não há package-lock.json em cli/ (sem dependências ainda), então
      # `npm ci` não se aplica.
      - name: Instala dependências
        run: npm install

      - name: Roda a suíte de testes do pacote
        run: npm test

      - name: Falha se a versão já existir no registry
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXISTING=$(npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "::error::$PKG_NAME@$PKG_VERSION já existe no npm registry. Faça bump da versão em cli/package.json antes de publicar."
            exit 1
          fi
          echo "$PKG_NAME@$PKG_VERSION ainda não publicada — prosseguindo com o publish."

      - name: Publica no npm
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publica no npm (dry-run manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
